name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Import smoke test
        run: python -m netsys_monitor --version

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Syntax check app.js
        run: node --check netsys_monitor/static/app.js

  build-exe:
    # Pastikan .exe tetap bisa dibangun di setiap perubahan (artefak tidak dipublikasikan)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m netsys_monitor --make-icon netsys.ico
      - run: pyinstaller --noconfirm --clean packaging/netsys_monitor.spec
      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NetsysMonitor.exe -ArgumentList "--no-browser","--no-tray","--no-public-ip","--no-single","--port","8799" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-RestMethod http://127.0.0.1:8799/api/health
          if (-not $r.ok) { throw "health check gagal" }
          $s = (Invoke-WebRequest http://127.0.0.1:8799/static/app.js).StatusCode
          if ($s -ne 200) { throw "static tidak ikut terbungkus" }
          Stop-Process $p -Force
